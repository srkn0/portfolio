name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v2

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - run: npm install

      - run: mise run gen

      - run: go vet ./...

      - run: go test ./... -race

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        env:
          KO_DOCKER_REPO: ghcr.io/srkn0/portfolio
        run: |
          ko build --bare \
            --tags=${{ github.ref_name }} \
            --tags=${{ github.sha }} \
            --tags=latest \
            .
